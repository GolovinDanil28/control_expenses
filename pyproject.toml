[project]
name = "control-expenses"
version = "0.0.0"
description = "Учёт личных расходов: транзакции, категории, бюджеты, отчёты."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiogram>=3.31",
  "httpx>=0.28",
  "pydantic>=2.7",
  "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
control-expenses = "control_expenses.interfaces.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_expenses"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # допустимы «похожие» символы в кириллице

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=control_expenses --cov-report=term-missing"
pythonpath = ["src"]
asyncio_mode = "auto"
